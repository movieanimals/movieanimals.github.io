name: fetch-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated videos
        run: |
          mkdir -p assets-tmp
          curl -fsSL -o assets-tmp/variant-A.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3GFZCOO0qNd1qdqvUYAgXtl511s/hf_20260709_040455_53636917-525e-4f32-8e14-f0b120a0c32b.mp4"
          curl -fsSL -o assets-tmp/variant-B.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3GFZCOO0qNd1qdqvUYAgXtl511s/hf_20260709_040455_aa99e7f2-fd53-4881-938b-db809343d92a.mp4"
          ls -la assets-tmp
      - name: Push to temp branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan claude/assets-tmp
          git rm -rf --cached . >/dev/null
          git add -f assets-tmp
          git commit -m "Temp: raw generated video variants"
          git push -f origin claude/assets-tmp
